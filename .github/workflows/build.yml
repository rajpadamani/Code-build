name: Firmware Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t firmware-builder .

      - name: Build Firmware
        run: |
          mkdir -p build

          docker run --rm \
            -v ${{ github.workspace }}/build:/workspace/build \
            firmware-builder \
            ./build.sh

      - name: Verify Artifacts
        run: ls -lah build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.elf
            build/*.bin
            build/*.hex
            build/*.map